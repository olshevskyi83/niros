confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.20
  self_compassion_present: -0.15
interview_priority: 8
therapeutic_relevance: Important for understanding inner criticism, perfectionistic pressure, self-worth, and the gap between how the person treats themselves and others.
