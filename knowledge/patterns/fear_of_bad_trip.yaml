canonical_id: fear_of_bad_trip
name: Fear of Difficult Experience
domain: session_concerns
definition: An observed signal that the person reports fear of a difficult or frightening
  session experience in their own words.
behavioral_description: The person may mention fear of a bad trip, dread of a frightening
  experience, or reported worry about the session going badly.
positive_evidence:
- Reported language matching this observed signal.
- Repeated self-report consistent with this pattern.
negative_evidence:
- Clear contradictory self-report.
- Neutral statement without this signal.
typical_phrases:
  en:
  - I'm afraid of a bad trip
  - I fear the experience will go badly
  - I'm scared of a difficult trip
  uk:
  - я боюся поганого досвіду
  - я боюся поганого тріпу
  - мені страшно, що досвід буде важким
  ru:
  - я боюсь плохого опыта
  - мне страшно, что опыт будет трудным
  - я боюсь bad trip
  es:
  - tengo miedo de un mal viaje
  - temo que la experiencia salga mal
  - me da miedo un trip difícil
follow_up_questions:
  en:
  - Can you say more about that in your own words?
  - When does this show up most strongly?
  - What, if anything, helps even a little?
  uk:
  - Можете сказати більше своїми словами?
  - Коли це проявляється найсильніше?
  - Що, якщо взагалі щось, трохи допомагає?
  ru:
  - Можете сказать больше своими словами?
  - Когда это проявляется сильнее всего?
  - Что, если вообще что-то, немного помогает?
  es:
  - ¿Puede decir más con sus propias palabras?
  - ¿Cuándo aparece con más fuerza?
  - ¿Qué, si algo, ayuda aunque sea un poco?
related_patterns:
- psychedelic_anxiety
- fear_of_body_sensations
relationships:
- target_pattern: psychedelic_anxiety
  relation_type: often_coexists_with
  weight: 0.8
- target_pattern: fear_of_body_sensations
  relation_type: often_coexists_with
  weight: 0.75
confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.2
  grounding_present: -0.1
interview_priority: 8
therapeutic_relevance: Important for intake understanding of self-reported signals
  without diagnosis, eligibility decisions, or treatment recommendations.
