canonical_id: integration_need
name: Integration Need
domain: session_concerns
definition: An observed signal that the person reports needing help integrating past
  or upcoming experience into daily life.
behavioral_description: The person may describe needing integration support, difficulty
  making sense after experience, or reported need to integrate insights.
positive_evidence:
- Reported language matching this observed signal.
- Repeated self-report consistent with this pattern.
negative_evidence:
- Clear contradictory self-report.
- Neutral statement without this signal.
typical_phrases:
  en:
  - I need help integrating the experience
  - integration feels important to me
  - I need support making sense afterward
  uk:
  - мені потрібна integration після досвіду
  - важливо інтегрувати досвід у життя
  - потрібна підтримка, щоб осмислити досвід
  ru:
  - мне нужна integration после опыта
  - важно интегрировать опыт в жизнь
  - нужна поддержка, чтобы осмыслить опыт
  es:
  - necesito ayuda para integrar la experiencia
  - la integración me parece importante
  - necesito apoyo para darle sentido después
follow_up_questions:
  en:
  - Can you say more about that in your own words?
  - When does this show up most strongly?
  - What, if anything, helps even a little?
  uk:
  - Можете сказати більше своїми словами?
  - Коли це проявляється найсильніше?
  - Що, якщо взагалі щось, трохи допомагає?
  ru:
  - Можете сказать больше своими словами?
  - Когда это проявляется сильнее всего?
  - Что, если вообще что-то, немного помогает?
  es:
  - ¿Puede decir más con sus propias palabras?
  - ¿Cuándo aparece con más fuerza?
  - ¿Qué, si algo, ayuda aunque sea un poco?
related_patterns:
- meaning_seeking
- life_transition_distress
relationships:
- target_pattern: meaning_seeking
  relation_type: often_coexists_with
  weight: 0.8
- target_pattern: life_transition_distress
  relation_type: often_coexists_with
  weight: 0.75
confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.2
  grounding_present: -0.1
interview_priority: 8
therapeutic_relevance: Important for intake understanding of self-reported signals
  without diagnosis, eligibility decisions, or treatment recommendations.
