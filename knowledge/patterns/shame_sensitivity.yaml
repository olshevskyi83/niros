confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.20
  recovery_after_setback: -0.10
interview_priority: 8
therapeutic_relevance: Important for understanding self-worth collapse, withdrawal, exposure fears, and how setbacks affect identity and relational behavior.
