canonical_id: symptom_unpredictability
name: Symptom Unpredictability
domain: body_pain
definition: An observed signal that the person reports unpredictable symptoms or not
  knowing how the body will feel.
behavioral_description: The person may describe symptoms changing unpredictably, not
  knowing what the body will do, or reported uncertainty about symptom flares.
positive_evidence:
- Reported language matching this observed signal.
- Repeated self-report consistent with this pattern.
negative_evidence:
- Clear contradictory self-report.
- Neutral statement without this signal.
typical_phrases:
  en:
  - my symptoms are unpredictable
  - I never know how my body will feel
  - symptoms flare without warning
  uk:
  - symptoms unpredictable
  - ніколи не знаю, як почуватиметься тіло
  - симптоми flare without warning
  ru:
  - symptoms unpredictable
  - никогда не знаю, как будет feel тело
  - симптомы flare without warning
  es:
  - mis síntomas son impredecibles
  - nunca sé cómo se sentirá mi cuerpo
  - los síntomas aparecen sin aviso
follow_up_questions:
  en:
  - Can you say more about that in your own words?
  - When does this show up most strongly?
  - What, if anything, helps even a little?
  uk:
  - Можете сказати більше своїми словами?
  - Коли це проявляється найсильніше?
  - Що, якщо взагалі щось, трохи допомагає?
  ru:
  - Можете сказать больше своими словами?
  - Когда это проявляется сильнее всего?
  - Что, если вообще что-то, немного помогает?
  es:
  - ¿Puede decir más con sus propias palabras?
  - ¿Cuándo aparece con más fuerza?
  - ¿Qué, si algo, ayuda aunque sea un poco?
related_patterns:
- activity_avoidance_due_to_pain
- body_trust_difficulty
relationships:
- target_pattern: activity_avoidance_due_to_pain
  relation_type: often_coexists_with
  weight: 0.8
- target_pattern: body_trust_difficulty
  relation_type: often_coexists_with
  weight: 0.75
confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.2
  grounding_present: -0.1
interview_priority: 8
therapeutic_relevance: Important for intake understanding of self-reported signals
  without diagnosis, eligibility decisions, or treatment recommendations.
