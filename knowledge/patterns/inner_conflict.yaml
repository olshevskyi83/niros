canonical_id: inner_conflict
name: Inner Conflict
domain: meaning_direction
definition: An observed signal that the person reports being torn between different
  inner directions or values.
behavioral_description: The person may describe inner conflict, feeling pulled two
  ways, or reported struggle between competing wants.
positive_evidence:
- Reported language matching this observed signal.
- Repeated self-report consistent with this pattern.
negative_evidence:
- Clear contradictory self-report.
- Neutral statement without this signal.
typical_phrases:
  en:
  - I feel torn inside
  - I'm in conflict with myself
  - part of me wants one thing and part another
  uk:
  - всередині torn
  - конфліктую with myself
  - one part wants one thing and part another
  ru:
  - внутри torn
  - конфликтую with myself
  - one part wants one thing and part another
  es:
  - me siento dividido por dentro
  - estoy en conflicto conmigo mismo
  - una parte quiere una cosa y otra otra
follow_up_questions:
  en:
  - Can you say more about that in your own words?
  - When does this show up most strongly?
  - What, if anything, helps even a little?
  uk:
  - Можете сказати більше своїми словами?
  - Коли це проявляється найсильніше?
  - Що, якщо взагалі щось, трохи допомагає?
  ru:
  - Можете сказать больше своими словами?
  - Когда это проявляется сильнее всего?
  - Что, если вообще что-то, немного помогает?
  es:
  - ¿Puede decir más con sus propias palabras?
  - ¿Cuándo aparece con más fuerza?
  - ¿Qué, si algo, ayuda aunque sea un poco?
related_patterns:
- identity_confusion
- life_transition_distress
relationships:
- target_pattern: identity_confusion
  relation_type: often_coexists_with
  weight: 0.8
- target_pattern: life_transition_distress
  relation_type: often_coexists_with
  weight: 0.75
confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.2
  grounding_present: -0.1
interview_priority: 8
therapeutic_relevance: Important for intake understanding of self-reported signals
  without diagnosis, eligibility decisions, or treatment recommendations.
