canonical_id: fear_of_body_sensations
name: Fear of Body Sensations
domain: session_concerns
definition: An observed signal that the person reports fear of intense or unfamiliar
  body sensations.
behavioral_description: The person may describe fear of bodily feelings, worry about
  strong sensations, or reported fright when the body feels unusual.
positive_evidence:
- Reported language matching this observed signal.
- Repeated self-report consistent with this pattern.
negative_evidence:
- Clear contradictory self-report.
- Neutral statement without this signal.
typical_phrases:
  en:
  - I'm afraid of strong body sensations
  - intense body feelings scare me
  - I'm scared of what I might feel in my body
  uk:
  - мені страшно від сильних відчуттів у тілі
  - я боюся незвичних відчуттів у тілі
  - інтенсивні body sensations мене лякають
  ru:
  - мне страшно от сильных телесных ощущений
  - я боюсь необычных ощущений в теле
  - интенсивные ощущения в теле меня пугают
  es:
  - me da miedo sentir sensaciones intensas en el cuerpo
  - tengo miedo de sensaciones corporales fuertes
  - me asustan las sensaciones físicas intensas
follow_up_questions:
  en:
  - Can you say more about that in your own words?
  - When does this show up most strongly?
  - What, if anything, helps even a little?
  uk:
  - Можете сказати більше своїми словами?
  - Коли це проявляється найсильніше?
  - Що, якщо взагалі щось, трохи допомагає?
  ru:
  - Можете сказать больше своими словами?
  - Когда это проявляется сильнее всего?
  - Что, если вообще что-то, немного помогает?
  es:
  - ¿Puede decir más con sus propias palabras?
  - ¿Cuándo aparece con más fuerza?
  - ¿Qué, si algo, ayuda aunque sea un poco?
related_patterns:
- somatic_anxiety
- fear_of_bad_trip
relationships:
- target_pattern: somatic_anxiety
  relation_type: often_coexists_with
  weight: 0.8
- target_pattern: fear_of_bad_trip
  relation_type: often_coexists_with
  weight: 0.75
confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.2
  grounding_present: -0.1
interview_priority: 8
therapeutic_relevance: Important for intake understanding of self-reported signals
  without diagnosis, eligibility decisions, or treatment recommendations.
