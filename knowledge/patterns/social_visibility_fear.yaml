canonical_id: social_visibility_fear
name: Social Visibility Fear
domain: speech_communication
definition: An observed signal that the person reports fear of being seen, heard,
  or noticed by others.
behavioral_description: The person may describe fear of visibility, dread of being
  noticed, or reported discomfort being seen while speaking.
positive_evidence:
- Reported language matching this observed signal.
- Repeated self-report consistent with this pattern.
negative_evidence:
- Clear contradictory self-report.
- Neutral statement without this signal.
typical_phrases:
  en:
  - I'm afraid of being noticed when I speak
  - I fear being visible to others
  - I hate being seen while talking
  uk:
  - боюся, що помітять, коли говорю
  - страшно being visible to others
  - не люблю, коли мене seen while talking
  ru:
  - боюсь, что заметят, когда говорю
  - страшно being visible to others
  - не люблю, когда меня seen while talking
  es:
  - tengo miedo de que me noten cuando hablo
  - temo ser visible para otros
  - odio que me vean mientras hablo
follow_up_questions:
  en:
  - Can you say more about that in your own words?
  - When does this show up most strongly?
  - What, if anything, helps even a little?
  uk:
  - Можете сказати більше своїми словами?
  - Коли це проявляється найсильніше?
  - Що, якщо взагалі щось, трохи допомагає?
  ru:
  - Можете сказать больше своими словами?
  - Когда это проявляется сильнее всего?
  - Что, если вообще что-то, немного помогает?
  es:
  - ¿Puede decir más con sus propias palabras?
  - ¿Cuándo aparece con más fuerza?
  - ¿Qué, si algo, ayuda aunque sea un poco?
related_patterns:
- fear_of_speaking
- shame_about_speech
relationships:
- target_pattern: fear_of_speaking
  relation_type: often_coexists_with
  weight: 0.8
- target_pattern: shame_about_speech
  relation_type: often_coexists_with
  weight: 0.75
confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.2
  grounding_present: -0.1
interview_priority: 8
therapeutic_relevance: Important for intake understanding of self-reported signals
  without diagnosis, eligibility decisions, or treatment recommendations.
