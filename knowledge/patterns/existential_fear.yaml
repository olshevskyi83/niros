    relation_type: often_coexists_with
    weight: 0.84
  - target_pattern: emotional_distress_signal
    relation_type: often_coexists_with
    weight: 0.80
  - target_pattern: safety_concern_signal
    relation_type: may_strengthen
    weight: 0.78
  - target_pattern: nightmare_disturbance
    relation_type: often_coexists_with
    weight: 0.68
confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.20
  grounding_present: -0.10
interview_priority: 9
therapeutic_relevance: Important for understanding reported fear about life, existence, or continuing, and for pacing follow-up with care without inferring diagnosis.
