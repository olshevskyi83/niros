follow_up_questions:
  en:
    - What most strongly changes how valuable you feel as a person?
    - What happens to your self-view after praise or criticism?
    - When has a small setback felt like it changed your whole worth?
    - What helps your sense of value feel more steady, even briefly?
  es:
    - ¿Qué cambia con más fuerza lo valioso que te sientes como persona?
    - ¿Qué le pasa a tu autoimagen después de un elogio o una crítica?
    - ¿Cuándo un pequeño contratiempo se sintió como si cambiara todo tu valor?
    - ¿Qué ayuda a que tu sentido de valor se sienta más estable, aunque sea por poco tiempo?
  ru:
    - Что сильнее всего меняет ощущение вашей ценности как человека?
    - Что происходит с вашим образом себя после похвалы или критики?
    - Когда небольшая неудача казалась изменившей всю вашу ценность?
    - Что помогает вашему чувству ценности быть более устойчивым, пусть даже ненадолго?
