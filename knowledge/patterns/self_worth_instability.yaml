canonical_id: self_worth_instability
name: Self-Worth Instability
domain: self_concept
definition: A pattern in which the person's sense of value rises or collapses in response to external signals such as praise, criticism, achievement, rejection, approval, or comparison.
behavioral_description: The person may feel valuable only after success or approval, feel worthless after criticism or rejection, depend on validation to feel okay, compare themselves to others to gauge worth, and experience sharp shifts in self-view based on feedback.
positive_evidence:
  - Feeling valuable only after success or approval.
  - Feeling worthless after criticism or rejection.
  - Mood and self-view changing strongly based on feedback.
  - Comparing self to others to decide personal value.
  - Needing external validation to feel okay.
  - Achievement temporarily increasing self-worth.
  - Small failures causing collapse in self-worth.
  - Uncertainty about being good enough as a person.
negative_evidence:
  - Stable self-worth across praise and criticism.
  - Self-value not collapsing after ordinary setbacks.
  - Internal sense of worth independent of recent feedback.
  - Comparison with others without global self-devaluation.
typical_phrases:
  en:
    - When someone praises me, I suddenly feel good about myself.
    - After criticism, I quickly feel worthless.
    - I track my value through how others react to me.
    - I am not sure whether I am good enough as a person.
    - A small failure can make my self-worth collapse.
    - When I achieve something, I feel valuable for a while.
    - I need approval to feel okay about myself.
    - Comparing myself to others decides how valuable I feel.
    - My sense of worth rises and falls depending on feedback.
    - I feel worthless after rejection.
    - I feel useless
    - I feel like I do not matter
    - I feel worthless
