canonical_id: trust_in_facilitator_difficulty
name: Facilitator Trust Difficulty
domain: session_concerns
definition: An observed signal that the person reports difficulty trusting a facilitator,
  guide, or session holder.
behavioral_description: The person may describe trouble trusting the facilitator,
  worry about being held safely, or reported difficulty relying on session support.
positive_evidence:
- Reported language matching this observed signal.
- Repeated self-report consistent with this pattern.
negative_evidence:
- Clear contradictory self-report.
- Neutral statement without this signal.
typical_phrases:
  en:
  - I find it hard to trust the facilitator
  - I struggle to trust the guide
  - I'm not sure I can trust the person holding the session
  uk:
  - мені важко довіряти фасилітатору
  - я не впевнений, що можу довіритися провіднику
  - важко довіритися тому, хто тримає сесію
  ru:
  - мне трудно доверять фасилитатору
  - я не уверен, что могу довериться проводнику
  - сложно довериться тому, кто держит сессию
  es:
  - me cuesta confiar en el facilitador
  - me cuesta confiar en la guía
  - no sé si puedo confiar en quien sostiene la sesión
follow_up_questions:
  en:
  - Can you say more about that in your own words?
  - When does this show up most strongly?
  - What, if anything, helps even a little?
  uk:
  - Можете сказати більше своїми словами?
  - Коли це проявляється найсильніше?
  - Що, якщо взагалі щось, трохи допомагає?
  ru:
  - Можете сказать больше своими словами?
  - Когда это проявляется сильнее всего?
  - Что, если вообще что-то, немного помогает?
  es:
  - ¿Puede decir más con sus propias palabras?
  - ¿Cuándo aparece con más fuerza?
  - ¿Qué, si algo, ayuda aunque sea un poco?
related_patterns:
- trust_difficulty
- safety_concern_signal
relationships:
- target_pattern: trust_difficulty
  relation_type: often_coexists_with
  weight: 0.8
- target_pattern: safety_concern_signal
  relation_type: often_coexists_with
  weight: 0.75
confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.2
  grounding_present: -0.1
interview_priority: 8
therapeutic_relevance: Important for intake understanding of self-reported signals
  without diagnosis, eligibility decisions, or treatment recommendations.
