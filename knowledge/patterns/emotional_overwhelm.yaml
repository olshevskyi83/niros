  contradiction_present: -0.25
  strong_emotional_intensity: 0.20
  grounded_recovery_present: -0.10
interview_priority: 8
therapeutic_relevance: Important for understanding flooding, shutdown after intensity, recovery needs, and how emotional scale affects daily functioning.
