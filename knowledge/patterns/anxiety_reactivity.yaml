confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.20
  self_soothing_capacity_present: -0.10
interview_priority: 8
therapeutic_relevance: Important for understanding rapid activation, bodily alarm, uncertainty sensitivity, and how anxiety spikes affect decisions and relationships.
