    relation_type: often_coexists_with
    weight: 0.81
  - target_pattern: fear_of_rejection
    relation_type: possible_cause
    weight: 0.74
  - target_pattern: boundary_difficulty
    relation_type: may_strengthen
    weight: 0.70
  - target_pattern: conflict_avoidance
    relation_type: possible_consequence
    weight: 0.68
confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.20
  successful_repair_experience: -0.15
interview_priority: 7
therapeutic_relevance: Important for understanding vigilance, self-protection, past relational injury, and barriers to closeness without implying permanent inability to trust.
