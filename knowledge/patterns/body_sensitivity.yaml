canonical_id: body_sensitivity
name: Body Sensitivity
domain: body_pain
definition: An observed signal that the person reports heightened sensitivity to touch,
  pressure, or bodily sensation.
behavioral_description: The person may describe the body feeling overly sensitive,
  touch hurting more than expected, or reported heightened bodily sensitivity.
positive_evidence:
- Reported language matching this observed signal.
- Repeated self-report consistent with this pattern.
negative_evidence:
- Clear contradictory self-report.
- Neutral statement without this signal.
typical_phrases:
  en:
  - my body feels overly sensitive
  - touch hurts more than it should
  - I'm very sensitive to body sensations
  uk:
  - тіло надто sensitive
  - дотик болить сильніше, ніж мав би
  - дуже чутливий до body sensations
  ru:
  - тело слишком sensitive
  - прикосновение болит сильнее, чем должно
  - очень чувствителен к body sensations
  es:
  - mi cuerpo se siente demasiado sensible
  - el tacto duele más de lo que debería
  - soy muy sensible a las sensaciones corporales
follow_up_questions:
  en:
  - Can you say more about that in your own words?
  - When does this show up most strongly?
  - What, if anything, helps even a little?
  uk:
  - Можете сказати більше своїми словами?
  - Коли це проявляється найсильніше?
  - Що, якщо взагалі щось, трохи допомагає?
  ru:
  - Можете сказать больше своими словами?
  - Когда это проявляется сильнее всего?
  - Что, если вообще что-то, немного помогает?
  es:
  - ¿Puede decir más con sus propias palabras?
  - ¿Cuándo aparece con más fuerza?
  - ¿Qué, si algo, ayuda aunque sea un poco?
related_patterns:
- somatic_anxiety
- symptom_unpredictability
relationships:
- target_pattern: somatic_anxiety
  relation_type: often_coexists_with
  weight: 0.8
- target_pattern: symptom_unpredictability
  relation_type: often_coexists_with
  weight: 0.75
confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.2
  grounding_present: -0.1
interview_priority: 8
therapeutic_relevance: Important for intake understanding of self-reported signals
  without diagnosis, eligibility decisions, or treatment recommendations.
