canonical_id: anticipation_anxiety
name: Anticipation Anxiety
domain: speech_communication
definition: An observed signal that the person reports anxiety building before speaking
  or being visible.
behavioral_description: The person may describe dread before talking, anxiety rising
  in anticipation, or reported pre-speech tension.
positive_evidence:
- Reported language matching this observed signal.
- Repeated self-report consistent with this pattern.
negative_evidence:
- Clear contradictory self-report.
- Neutral statement without this signal.
typical_phrases:
  en:
  - I dread speaking before it even starts
  - anticipation anxiety builds before I talk
  - I worry long before I have to speak
  uk:
  - anticipation anxiety перед тим, як говорити
  - тривога наростає до розмови
  - хвилююся задовго до того, як треба говорити
  ru:
  - anticipation anxiety перед тем, как говорить
  - тревога нарастает до разговора
  - волнуюсь задолго до того, как нужно говорить
  es:
  - anticipo ansiedad antes de hablar
  - la ansiedad crece antes de hablar
  - me preocupo mucho antes de tener que hablar
follow_up_questions:
  en:
  - Can you say more about that in your own words?
  - When does this show up most strongly?
  - What, if anything, helps even a little?
  uk:
  - Можете сказати більше своїми словами?
  - Коли це проявляється найсильніше?
  - Що, якщо взагалі щось, трохи допомагає?
  ru:
  - Можете сказать больше своими словами?
  - Когда это проявляется сильнее всего?
  - Что, если вообще что-то, немного помогает?
  es:
  - ¿Puede decir más con sus propias palabras?
  - ¿Cuándo aparece con más fuerza?
  - ¿Qué, si algo, ayuda aunque sea un poco?
related_patterns:
- speech_anxiety
- social_visibility_fear
relationships:
- target_pattern: speech_anxiety
  relation_type: often_coexists_with
  weight: 0.8
- target_pattern: social_visibility_fear
  relation_type: often_coexists_with
  weight: 0.75
confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.2
  grounding_present: -0.1
interview_priority: 8
therapeutic_relevance: Important for intake understanding of self-reported signals
  without diagnosis, eligibility decisions, or treatment recommendations.
