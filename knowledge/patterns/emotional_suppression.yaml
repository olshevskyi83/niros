confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.20
  open_emotional_expression_present: -0.15
interview_priority: 8
therapeutic_relevance: Important for understanding how the person handles inner distress, visibility of emotion, and whether suppression affects connection, burnout, or later overwhelm.
