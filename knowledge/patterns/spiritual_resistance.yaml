canonical_id: spiritual_resistance
name: Spiritual Resistance
domain: session_concerns
definition: An observed signal that the person reports resistance to spiritual framing
  or inner/spiritual language.
behavioral_description: The person may describe discomfort with spiritual language,
  resistance to mystical framing, or reported preference to avoid spiritual themes.
positive_evidence:
- Reported language matching this observed signal.
- Repeated self-report consistent with this pattern.
negative_evidence:
- Clear contradictory self-report.
- Neutral statement without this signal.
typical_phrases:
  en:
  - I'm resistant to spiritual language
  - I feel uncomfortable with mystical framing
  - I resist the spiritual side of this
  uk:
  - я опираюся духовному мовленню
  - мені некомфортно з містичними формулюваннями
  - я не хочу духовних рамок
  ru:
  - я сопротивляюсь духовному языку
  - мне некомfortно с мистическими формулировками
  - я не хочу духовных рамок
  es:
  - me resisto al lenguaje espiritual
  - me incomoda el encuadre místico
  - me resisto al lado espiritual de esto
follow_up_questions:
  en:
  - Can you say more about that in your own words?
  - When does this show up most strongly?
  - What, if anything, helps even a little?
  uk:
  - Можете сказати більше своїми словами?
  - Коли це проявляється найсильніше?
  - Що, якщо взагалі щось, трохи допомагає?
  ru:
  - Можете сказать больше своими словами?
  - Когда это проявляется сильнее всего?
  - Что, если вообще что-то, немного помогает?
  es:
  - ¿Puede decir más con sus propias palabras?
  - ¿Cuándo aparece con más fuerza?
  - ¿Qué, si algo, ayuda aunque sea un poco?
related_patterns:
- control_resistance
- spiritual_openness
relationships:
- target_pattern: control_resistance
  relation_type: often_coexists_with
  weight: 0.8
- target_pattern: spiritual_openness
  relation_type: often_coexists_with
  weight: 0.75
confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.2
  grounding_present: -0.1
interview_priority: 8
therapeutic_relevance: Important for intake understanding of self-reported signals
  without diagnosis, eligibility decisions, or treatment recommendations.
