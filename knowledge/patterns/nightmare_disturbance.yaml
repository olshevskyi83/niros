  contradiction_present: -0.25
  strong_emotional_intensity: 0.20
  restful_sleep_reported: -0.10
interview_priority: 7
therapeutic_relevance: Important for understanding sleep-related distress, reported nightmares, and how frightening dream content affects daily functioning.
