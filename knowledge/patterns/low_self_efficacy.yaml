confidence_rules:
  repeated_evidence: 0.15
  contradiction_present: -0.25
  strong_emotional_intensity: 0.20
  successful_self_directed_action: -0.15
interview_priority: 8
therapeutic_relevance: Important for understanding perceived agency, action avoidance, learned helplessness patterns, and the gap between capability and confidence in personal change.
