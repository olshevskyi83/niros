  - id: ru_selfworth_002
    language: ru
    input: >
      Моя самооценка сильно меняется в зависимости от того, как со мной обращаются другие.
    expected_facts:
      - category: self
        attribute: self_worth
        value: unstable

  # Spanish (10)
  - id: es_relationship_001
