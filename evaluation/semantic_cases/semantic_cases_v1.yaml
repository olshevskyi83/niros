version: 1
description: NIROS semantic extraction benchmark — v1 (40 cases, 4 languages)
cases:
  # English (10)
  - id: en_relationship_001
    language: en
    input: >
      I usually avoid conflicts because I don't want people to dislike me.
    expected_facts:
      - category: relationship
        attribute: conflict
        value: avoidant
      - category: relationship
        attribute: fear_of_rejection
        value: present

  - id: en_relationship_002
    language: en
    input: >
      I become anxious when someone stops replying to my messages.
    expected_facts:
      - category: relationship
        attribute: attachment
        value: anxious
      - category: relationship
        attribute: fear_of_rejection
        value: anxious

  - id: en_self_001
    language: en
    input: >
      I do not really know who I am.
    expected_facts:
      - category: self
        attribute: identity
        value: unclear

  - id: en_selfworth_001
    language: en
    input: >
      I often think I'm not good enough.
    expected_facts:
      - category: self
        attribute: self_worth
        value: low

  - id: en_trust_001
    language: en
    input: >
      I rarely trust new people.
    expected_facts:
      - category: relationship
        attribute: trust
        value: low

  - id: en_boundaries_001
    language: en
    input: >
      I find it hard to say no when people ask me for favors.
    expected_facts:
      - category: relationship
        attribute: boundary_setting
        value: weak

  - id: en_shame_001
    language: en
    input: >
      I feel ashamed when someone criticizes me, even gently.
    expected_facts:
      - category: emotion
        attribute: reaction_to_criticism
        value: strong

  - id: en_perfectionism_001
    language: en
    input: >
      I feel like I have to do everything perfectly or it is not worth doing.
    expected_facts:
      - category: self
        attribute: self_worth
        value: unstable
      - category: agency
        attribute: self_efficacy
        value: high

  - id: en_attachment_001
    language: en
    input: >
      I worry that people I care about will leave me.
    expected_facts:
      - category: relationship
        attribute: attachment
        value: anxious

  - id: en_selfworth_002
    language: en
    input: >
      My sense of self-worth changes a lot depending on how others treat me.
    expected_facts:
      - category: self
        attribute: self_worth
        value: unstable

  # Ukrainian (10)
  - id: uk_relationship_001
    language: uk
    input: >
      Я зазвичай уникаю конфліктів, бо не хочу, щоб люди мене не любили.
    expected_facts:
      - category: relationship
        attribute: conflict
        value: avoidant
      - category: relationship
        attribute: fear_of_rejection
        value: present

  - id: uk_relationship_002
    language: uk
    input: >
      Мені тривожно, коли хтось перестає відповідати на мої повідомлення.
    expected_facts:
      - category: relationship
        attribute: attachment
        value: anxious
      - category: relationship
        attribute: fear_of_rejection
        value: anxious

  - id: uk_self_001
    language: uk
    input: >
      Я справді не знаю, хто я.
    expected_facts:
      - category: self
        attribute: identity
        value: unclear

  - id: uk_selfworth_001
    language: uk
    input: >
      Я часто думаю, що недостатньо хороший як людина.
    expected_facts:
      - category: self
        attribute: self_worth
        value: low

  - id: uk_trust_001
    language: uk
    input: >
      Я рідко довіряю новим людям.
    expected_facts:
      - category: relationship
        attribute: trust
        value: low

  - id: uk_boundaries_001
    language: uk
    input: >
      Мені важко сказати «ні», коли люди просять про послуги.
    expected_facts:
      - category: relationship
        attribute: boundary_setting
        value: weak

  - id: uk_shame_001
    language: uk
    input: >
      Я відчуваю сором, коли мене критикують, навіть делікатно.
    expected_facts:
      - category: emotion
        attribute: reaction_to_criticism
        value: strong

  - id: uk_perfectionism_001
    language: uk
    input: >
      Я відчуваю, що мушу робити все ідеально, інакше це не має сенсу.
    expected_facts:
      - category: self
        attribute: self_worth
        value: unstable
      - category: agency
        attribute: self_efficacy
        value: high

  - id: uk_attachment_001
    language: uk
    input: >
      Я хвилююся, що люди, які мені дорогі, покинуть мене.
    expected_facts:
      - category: relationship
        attribute: attachment
        value: anxious

  - id: uk_selfworth_002
    language: uk
    input: >
      Моя самооцінка сильно змінюється залежно від того, як зі мною ставляться інші.
    expected_facts:
      - category: self
        attribute: self_worth
        value: unstable

