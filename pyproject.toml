[project]
name = "niros"
version = "0.1.0"
description = "NIROS Human Understanding Engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
voice = [
    "SpeechRecognition>=3.10.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["niros*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
